<script>
  // ===========================================
  // 設定區
  // ===========================================
  const firebaseConfig = {
    apiKey: "AIzaSyDfmAcELvmnoNtMYqaUM072RXAHUGLuB1Y",
    authDomain: "dreamboard-app-a3b38.firebaseapp.com",
    projectId: "dreamboard-app-a3b38",
    storageBucket: "dreamboard-app-a3b38.firebasestorage.app",
    messagingSenderId: "344657606959",
    appId: "1:344657606959:web:5f5097df416204999389da",
    measurementId: "G-72ELQT1DD7"
  };

  const OLD_API_URL = "https://script.google.com/macros/s/AKfycbyNxo_-qndGStbxkayF0bW3oKaGLwqFQZEnxfcAVMWU2mgGzv6ypJMsCn7gPZY2HObs-w/exec";

  // 初始化 Firebase
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const auth = firebase.auth();
  const db = firebase.firestore();

  // 預設範例資料 (僅在資料庫完全無資料時初始化)
  const DEFAULT_ITEMS = [
    { id: "g1", category: "Home", type: "Goal", content: "成為更具影響力且平衡生活的人" },
    { id: "g2", category: "Health", type: "Goal", content: "保持規律運動與健康飲食，擁有充沛活力" },
    { id: "r1", category: "Health", type: "Reminder", content: "每半年定期洗牙檢查", dateValue: new Date().toISOString().slice(0,10), isStarred: true, isDone: false },
    { id: "t1", category: "Health", type: "Todo", content: "報名每週二次瑜珈課", isStarred: false, isDone: false },
    { id: "g3", category: "Work", type: "Goal", content: "提升專業技能，完成年度核心專案" },
    { id: "t2", category: "Work", type: "Todo", content: "閱讀專業書籍一本", isStarred: true, isDone: false }
  ];

  let currentUser = null;
  let unsubscribeSnapshot = null;
  let allData = [];
  let lastUpdateTimestamp = 0;
  let currentCategory = 'Home';
  let editModal;

  const DOMAINS = [
    { id: 'Health', name: '健康', icon: 'fa-heart-pulse' },
    { id: 'Rest', name: '休養', icon: 'fa-book-open' },
    { id: 'Spirit', name: '心靈', icon: 'fa-spa' },
    { id: 'Work', name: '工作', icon: 'fa-briefcase' },
    { id: 'Family', name: '家庭', icon: 'fa-user-group' },
    { id: 'Money', name: '經濟', icon: 'fa-sack-dollar' }
  ];
  
  const CATEGORY_HOME = { id: 'Home', name: '首頁總覽', icon: 'fa-house' };

  window.onload = function() {
    renderNavbar();
    const modalEl = document.getElementById('editModal');
    if (modalEl && typeof bootstrap !== 'undefined') {
      editModal = new bootstrap.Modal(modalEl);
    }
    document.getElementById('btnSave').onclick = saveEdit;
    document.getElementById('btnDelete').onclick = deleteEdit;

    // === 🔒 端對端加密 (E2E AES-256-GCM) 模組 ===
    let cryptoKey = null;

    async function initCryptoKey(uid) {
      try {
        const encoder = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
          "raw",
          encoder.encode("HandyDreamSecretSalt_2026_" + uid),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );
        cryptoKey = await window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: encoder.encode("Salt_" + uid),
            iterations: 100000,
            hash: "SHA-256"
          },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );
      } catch (e) {
        console.error("端對端加密初始化失敗:", e);
      }
    }

    async function encryptData(plainText) {
      if (!plainText || !cryptoKey) return plainText;
      if (typeof plainText === 'string' && plainText.startsWith('ENC:v1:')) return plainText;
      
      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(plainText);
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const encryptedBuffer = await window.crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv },
          cryptoKey,
          data
        );
        
        const combined = new Uint8Array(iv.length + encryptedBuffer.byteLength);
        combined.set(iv, 0);
        combined.set(new Uint8Array(encryptedBuffer), iv.length);
        
        let binary = '';
        const len = combined.byteLength;
        for (let i = 0; i < len; i++) {
          binary += String.fromCharCode(combined[i]);
        }
        return 'ENC:v1:' + btoa(binary);
      } catch (e) {
        console.error("加密過程失敗:", e);
        return plainText;
      }
    }

    async function decryptData(cipherText) {
      if (!cipherText || !cryptoKey) return cipherText;
      if (typeof cipherText !== 'string' || !cipherText.startsWith('ENC:v1:')) return cipherText;
      
      try {
        const base64Str = cipherText.slice(7);
        const binary = atob(base64Str);
        const combined = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          combined[i] = binary.charCodeAt(i);
        }
        
        const iv = combined.slice(0, 12);
        const data = combined.slice(12);
        
        const decryptedBuffer = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          cryptoKey,
          data
        );
        
        return new TextDecoder().decode(decryptedBuffer);
      } catch (e) {
        console.error("解密失敗:", e);
        return "🔒 [無法解密內容]";
      }
    }

    // 監聽 Firebase Authentication 狀態變更
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        await initCryptoKey(user.uid);
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('user-info-area').style.display = 'block';
        document.getElementById('user-email-text').innerText = user.email || user.displayName || '已登入';
        subscribeToUserData(user.uid);
      } else {
        currentUser = null;
        cryptoKey = null;
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        document.getElementById('user-info-area').style.display = 'none';
        document.getElementById('login-overlay').style.display = 'flex';
        document.getElementById('loading').style.display = 'none';
      }
    });
  };

  // Google 登入
  function loginWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    document.getElementById('loading').style.display = 'flex';
    document.getElementById('loading-text').innerText = "登入驗證中...";

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (isMobile) {
      auth.signInWithRedirect(provider);
    } else {
      auth.signInWithPopup(provider).then(async (result) => {
        if (result && result.credential && result.credential.idToken) {
          localStorage.setItem("google_token", result.credential.idToken);
        }
      }).catch(error => {
        if (error.code === 'auth/popup-blocked' || error.code === 'auth/popup-closed-by-user') {
          auth.signInWithRedirect(provider);
        } else {
          console.error("Google 登入失敗:", error);
          alert("登入失敗: " + error.message);
          document.getElementById('loading').style.display = 'none';
        }
      });
    }
  }

  // 登出帳號
  function logout() {
    if (confirm("確定要登出帳號嗎？")) {
      auth.signOut();
    }
  }

  // 取得 Firestore 使用者文件參照
  function getUserDocRef(uid) {
    return db.collection('users').doc(uid);
  }

  // 從舊版 (Google Apps Script) 遷移資料
  async function migrateFromOldApi(uid, token, force = false) {
    try {
      const docRef = getUserDocRef(uid);
      const docSnap = await docRef.get();
      // 若文件不存在或強制進行匯入
      if (!docSnap.exists || force) {
        let response = await fetch(OLD_API_URL, {
          method: 'POST',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: 'getData', token: token })
        });
        const data = await response.json();
        if (data && data.items && data.items.length > 0) {
          allData = data.items;
          lastUpdateTimestamp = data.lastUpdated || Date.now();
          await saveToFirestore(allData);
          return true;
        }
      }
    } catch (err) {
      console.warn("無法自動匯入舊版資料:", err);
    }
    return false;
  }

  // 手動一鍵匯入舊版資料
  async function importOldDataManually() {
    const token = localStorage.getItem("google_token");
    if (!token) {
      alert("請登入 Google 帳號後再進行匯入。");
      return;
    }
    if (!confirm("確定要從舊版 (Google Apps Script API) 載入舊資料並備份儲存至 Firebase 嗎？")) return;

    document.getElementById('loading').style.display = 'flex';
    document.getElementById('loading-text').innerText = "從舊版資料庫匯入中...";
    const success = await migrateFromOldApi(currentUser.uid, token, true);
    document.getElementById('loading').style.display = 'none';
    if (success) {
      alert("成功將舊版資料匯入至 Firebase！");
    } else {
      alert("嘗試讀取舊版資料失敗，請確認登入權限或舊版是否有資料。");
    }
  }

  // 訂閱 Firestore 即時資料變動
  function subscribeToUserData(uid) {
    document.getElementById('loading').style.display = 'flex';
    document.getElementById('loading-text').innerText = "資料解密同步中...";
    const docRef = getUserDocRef(uid);
    
    if (unsubscribeSnapshot) unsubscribeSnapshot();

    unsubscribeSnapshot = docRef.onSnapshot(async doc => {
      if (doc.exists) {
        const data = doc.data();
        const rawItems = data.items || [];
        allData = await Promise.all(rawItems.map(async item => ({
          ...item,
          content: await decryptData(item.content)
        })));
        lastUpdateTimestamp = data.lastUpdated || Date.now();
      } else {
        // 先嘗試檢查是否有舊版 Apps Script 資料
        const token = localStorage.getItem("google_token");
        let migrated = false;
        if (token) {
          migrated = await migrateFromOldApi(uid, token, false);
        }
        if (!migrated) {
          allData = [...DEFAULT_ITEMS];
          lastUpdateTimestamp = Date.now();
          await saveToFirestore(allData);
        }
      }
      renderContent();
      document.getElementById('loading').style.display = 'none';
    }, error => {
      console.error("Firestore 資料讀取失敗:", error);
      alert("資料讀取失敗，請確認 Firebase 設定與網絡連線。");
      document.getElementById('loading').style.display = 'none';
    });
  }

  // 將資料寫入 Firestore (已加入 E2E 加密)
  async function saveToFirestore(newItems) {
    if (!currentUser) return;
    lastUpdateTimestamp = Date.now();
    allData = newItems;
    try {
      const encryptedItems = await Promise.all(allData.map(async item => ({
        ...item,
        content: await encryptData(item.content)
      })));
      await getUserDocRef(currentUser.uid).set({
        items: encryptedItems,
        lastUpdated: lastUpdateTimestamp
      }, { merge: true });
    } catch (error) {
      console.error("儲存至 Firestore 失敗:", error);
      alert("資料儲存失敗: " + error.message);
    }
  }

  // --- UI 渲染 ---
  function renderNavbar() {
    const navScroll = document.getElementById('nav-categories');
    navScroll.innerHTML = DOMAINS.map(cat => `
      <a href="javascript:void(0)" class="nav-cat-item ${cat.id === currentCategory ? 'active' : ''}" onclick="switchCategory('${cat.id}')">
        <i class="fa-solid ${cat.icon}"></i><span>${cat.name}</span>
      </a>
    `).join('');
    
    const btnHome = document.getElementById('btn-home-large');
    if (currentCategory === 'Home') {
      btnHome.classList.add('active'); btnHome.innerHTML = '<i class="fa-solid fa-house me-2"></i> 首頁 / 整體目標';
    } else {
      btnHome.classList.remove('active'); btnHome.innerHTML = '<i class="fa-solid fa-house me-2"></i> 回首頁';
    }

    const sidebarMenu = document.getElementById('sidebar-menu-container');
    let sidebarHtml = `
        <a href="javascript:void(0)" class="sidebar-item ${currentCategory === 'Home' ? 'active' : ''} mb-2" onclick="switchCategory('Home')">
            <i class="fa-solid ${CATEGORY_HOME.icon}"></i>${CATEGORY_HOME.name}
        </a>
        <a href="note/index.html" class="sidebar-item mb-3" style="background: #fffdf0; color: #b45309; border: 1px solid #fef3c7;">
            <i class="fa-solid fa-lightbulb text-warning me-2"></i>靈感隨手記
        </a>
        <div class="text-muted small fw-bold mb-2 ps-3">生活領域</div>
    `;
    sidebarHtml += DOMAINS.map(cat => `
      <a href="javascript:void(0)" class="sidebar-item ${cat.id === currentCategory ? 'active' : ''}" onclick="switchCategory('${cat.id}')">
        <i class="fa-solid ${cat.icon}"></i>${cat.name}
      </a>
    `).join('');
    sidebarMenu.innerHTML = sidebarHtml;
  }

  function switchCategory(id) {
    currentCategory = id;
    renderNavbar();
    if(window.innerWidth < 992) window.scrollTo(0,0);
    renderContent();
  }

  function renderContent() {
    const container = document.getElementById('app-content');
    container.innerHTML = '';
    
    let catInfo = (currentCategory === 'Home') ? CATEGORY_HOME : DOMAINS.find(c=>c.id===currentCategory);
    let goal = allData.find(d => d.category === currentCategory && d.type === 'Goal')?.content || '';
    let headerIcon = currentCategory === 'Home' ? 'fa-earth-americas' : catInfo.icon;
    
    let headerHtml = `
      <div class="category-header">
        <h4 class="mb-4 text-dark fw-bolder"><i class="fa-solid ${headerIcon} me-3 text-primary"></i>${catInfo.name}目標</h4>
        <textarea class="form-control goal-textarea bg-light shadow-sm p-4" rows="3" style="border-radius: 15px; resize: none; font-size: 1.1rem;" placeholder="寫下此領域最重要的目標與願景..." onblur="saveTopGoal(this)">${goal}</textarea>
        <div class="text-end mt-1"><small class="text-muted" id="save-status-text" style="opacity:0; transition: opacity 0.3s;">已儲存</small></div>
      </div>`;
    container.innerHTML = headerHtml;

    if (currentCategory === 'Home') {
      container.innerHTML += `
        <div class="px-3 px-lg-0 mb-4">
          <a href="note/index.html" class="card p-3 text-decoration-none shadow-sm border-0 d-flex flex-row align-items-center" style="background: linear-gradient(135deg, #fffdf0, #fff7d6); border-radius: 18px; border: 1px solid #fef3c7 !important;">
            <div class="rounded-circle bg-warning text-white me-3 d-flex align-items-center justify-content-center flex-shrink-0" style="width:48px; height:48px; font-size:1.4rem;">
              <i class="fa-solid fa-lightbulb"></i>
            </div>
            <div class="flex-grow-1">
              <h6 class="fw-bold mb-1" style="color: #92400e;">💡 靈感隨手記</h6>
              <small class="text-secondary">隨時捕捉閃光般的創意想法與日常隨筆 ➔</small>
            </div>
          </a>
        </div>
      `;
      let starred = allData.filter(d => d.isStarred && d.type !== 'Goal');
      container.innerHTML += `<div class="px-3 px-lg-0 pb-3"><div class="text-secondary fw-bold mb-3 ps-2"><i class="fa-solid fa-star text-warning me-2"></i>重點關注項目</div><div id="list-home"></div></div>`;
      renderList(document.getElementById('list-home'), starred, false);
      
      // --- 在首頁加入底部 Footer (上次更新 + 匯入舊資料 + 清除資料 + 登出) ---
      let diffDays = 0;
      if (lastUpdateTimestamp) {
        let diff = new Date().getTime() - lastUpdateTimestamp;
        diffDays = Math.floor(diff / (1000 * 60 * 60 * 24));
      }
      container.innerHTML += `
        <div class="home-footer">
            <div class="mb-2"><i class="fa-solid fa-clock-rotate-left me-1"></i> 距離上次更新藍圖已過 ${diffDays} 天</div>
            <div>
              <button class="btn btn-clear-data" onclick="resetAccount()"><i class="fa-solid fa-trash-can me-1"></i>重置資料</button>
              <button class="btn btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-1"></i>登出</button>
            </div>
        </div>
      `;
    } else {
      let reminders = allData.filter(d => d.category === currentCategory && d.type === 'Reminder');
      let todos = allData.filter(d => d.category === currentCategory && d.type === 'Todo');
      
      container.innerHTML += `
        <div class="desktop-two-col-grid px-3 px-lg-0 pb-5">
            <div class="col-block">
                <div class="d-flex justify-content-between align-items-center mb-3 ps-2">
                    <span class="fw-bold text-secondary"><i class="fa-solid fa-bell me-2"></i>提醒與追蹤</span>
                    <button class="btn btn-sm btn-primary rounded-circle shadow-sm" style="width:32px;height:32px;" onclick="openAddModal('Reminder')"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div id="list-rem"></div>
            </div>
            <div class="col-block">
                 <div class="d-flex justify-content-between align-items-center mb-3 ps-2 mt-4 mt-lg-0">
                    <span class="fw-bold text-secondary"><i class="fa-solid fa-list-check me-2"></i>待辦事項</span>
                    <button class="btn btn-sm btn-primary rounded-circle shadow-sm" style="width:32px;height:32px;" onclick="openAddModal('Todo')"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div id="list-todo"></div>
            </div>
        </div>
      `;
      renderList(document.getElementById('list-rem'), reminders, true);
      renderList(document.getElementById('list-todo'), todos, true);
    }
  }

  function renderList(el, items, sortable) {
    if(!items.length) { el.innerHTML = '<div class="text-center text-muted py-5 opacity-50"><i class="fa-solid fa-inbox fa-3x mb-3"></i><br>暫無項目</div>'; return; }
    
    el.innerHTML = items.map(item => {
      let daysHtml = '';
      if(item.type === 'Reminder' && item.dateValue) {
        let today = new Date();
        today.setHours(0,0,0,0);
        let target = new Date(item.dateValue);
        target.setHours(0,0,0,0);
        let diff = Math.floor((today - target) / (1000*60*60*24));
        
        let badgeClass = '', badgeText = '';
        if (diff > 0) { badgeClass = diff > 30 ? 'overdue' : ''; badgeText = `已過 ${diff} 天`; }
        else if (diff < 0) { badgeClass = 'future'; badgeText = `還有 ${Math.abs(diff)} 天`; }
        else { badgeClass = 'today'; badgeText = '就是今天'; }
        
        daysHtml = `
            <div class="d-flex align-items-center">
                <span class="days-badge ${badgeClass}">${badgeText}</span>
                <button class="btn btn-reset shadow-sm" onclick="resetReminderDate('${item.id}')" title="重置為今天">
                    <i class="fa-solid fa-rotate-left me-1"></i>重置
                </button>
            </div>
        `;
      }
      return `
        <div class="card item-row ${item.isDone?'opacity-50':''}" data-id="${item.id}">
          <div class="item-top-row">
            ${sortable ? '<div class="me-3 text-muted drag-handle" style="cursor:grab;"><i class="fa-solid fa-grip-vertical"></i></div>' : ''}
            <i class="star-btn fa-${item.isStarred?'solid':'regular'} fa-star ${item.isStarred?'active':''}" onclick="updateField('${item.id}','isStarred',!${item.isStarred})"></i>
            ${item.type==='Todo'?`<input type="checkbox" class="form-check-input me-3 shadow-sm" style="width: 1.2em; height: 1.2em;" ${item.isDone?'checked':''} onchange="updateField('${item.id}','isDone',this.checked)">`:''}
            <div class="item-content-text ${item.isDone?'strikethrough':''}">${item.content}</div>
          </div>
          <div class="item-bottom-row">
             <div>${daysHtml}</div>
             <button class="btn btn-icon-text bg-light text-secondary shadow-sm ms-auto" onclick="openEditModal('${item.id}')"><i class="fa-solid fa-pen me-1"></i>編輯</button>
          </div>
        </div>`;
    }).join('');

    if(sortable) new Sortable(el, { handle: '.drag-handle', animation: 150, ghostClass: 'bg-light', onEnd: saveOrder });
  }

  async function saveTopGoal(el) { 
    el.classList.add('saving');
    let item = allData.find(d => d.category === currentCategory && d.type === 'Goal');
    if (item) {
      item.content = el.value;
    } else {
      allData.push({
        id: 'goal_' + currentCategory,
        category: currentCategory,
        type: 'Goal',
        content: el.value
      });
    }
    
    await saveToFirestore(allData);
    el.classList.remove('saving');
    el.classList.add('saved');
    document.getElementById('save-status-text').style.opacity = '1';
    setTimeout(() => {
        el.classList.remove('saved');
        document.getElementById('save-status-text').style.opacity = '0';
    }, 1500);
  }

  async function updateField(id, field, val) {
    let item = allData.find(d => d.id == id);
    if(item) {
      item[field] = val;
      renderContent();
      await saveToFirestore(allData);
    }
  }
  
  async function resetReminderDate(id) {
    let today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
    let item = allData.find(d => d.id == id);
    if (item) {
      item.dateValue = today.toISOString().slice(0,10);
      renderContent();
      await saveToFirestore(allData);
    }
  }

  // --- 重置帳號資料 ---
  async function resetAccount() {
    if(!confirm("【警告】\n確定要刪除所有資料並重置嗎？\n\n這將會：\n1. 刪除您所有的目標、待辦與提醒\n2. 重新載入系統預設的範例資料\n\n此動作無法復原！")) return;
    
    document.getElementById('loading').style.display = 'flex';
    allData = [...DEFAULT_ITEMS];
    await saveToFirestore(allData);
    renderContent();
    document.getElementById('loading').style.display = 'none';
    alert("資料已重置為預設狀態！");
  }

  async function saveOrder() {
    let ids = [];
    document.querySelectorAll('.item-row').forEach(el => ids.push(el.getAttribute('data-id')));
    // 依據 DOM 順序調整 allData 內相同類別與型態的項目順序
    let otherData = allData.filter(d => !ids.includes(d.id.toString()));
    let orderedData = ids.map(id => allData.find(d => d.id.toString() === id.toString())).filter(Boolean);
    allData = [...otherData, ...orderedData];
    await saveToFirestore(allData);
  }
  
  function openAddModal(type) {
    document.getElementById('modalTitle').innerText = type === 'Reminder' ? '新增提醒' : '新增待辦';
    document.getElementById('editId').value = ''; document.getElementById('editType').value = type;
    document.getElementById('editContent').value = ''; document.getElementById('btnDelete').style.display = 'none';
    document.getElementById('editDateGroup').classList.toggle('d-none', type !== 'Reminder');
    if(type === 'Reminder') {
        let now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('editDate').value = now.toISOString().slice(0,10);
    }
    editModal.show();
  }

  function openEditModal(id) {
    let item = allData.find(d => d.id == id); if(!item) return;
    document.getElementById('modalTitle').innerText = '編輯項目';
    document.getElementById('editId').value = item.id; document.getElementById('editType').value = item.type;
    document.getElementById('editContent').value = item.content; document.getElementById('editDate').value = item.dateValue || '';
    document.getElementById('btnDelete').style.display = 'block';
    document.getElementById('editDateGroup').classList.toggle('d-none', item.type !== 'Reminder');
    editModal.show();
  }

  async function saveEdit() {
    editModal.hide();
    let id = document.getElementById('editId').value;
    let type = document.getElementById('editType').value;
    let content = document.getElementById('editContent').value.trim();
    let dateValue = document.getElementById('editDate').value;
    
    if (!content) return;

    if (id) {
      let item = allData.find(d => d.id == id);
      if (item) {
        item.content = content;
        if (type === 'Reminder') item.dateValue = dateValue;
      }
    } else {
      let newItem = {
        id: 'item_' + Date.now(),
        category: currentCategory,
        type: type,
        content: content,
        isStarred: false,
        isDone: false
      };
      if (type === 'Reminder') newItem.dateValue = dateValue;
      allData.push(newItem);
    }

    renderContent();
    await saveToFirestore(allData);
  }

  async function deleteEdit() {
    if(!confirm('確認刪除此項目？')) return;
    editModal.hide();
    let id = document.getElementById('editId').value;
    allData = allData.filter(d => d.id != id);
    renderContent();
    await saveToFirestore(allData);
  }
</script>
</body>
</html>

<script>
  // ===========================================
  // Firebase 設定
  // ===========================================
  const firebaseConfig = {
    apiKey: "AIzaSyDfmAcELvmnoNtMYqaUM072RXAHUGLuB1Y",
    authDomain: "dreamboard-app-a3b38.firebaseapp.com",
    projectId: "dreamboard-app-a3b38",
    storageBucket: "dreamboard-app-a3b38.firebasestorage.app",
    messagingSenderId: "344657606959",
    appId: "1:344657606959:web:5f5097df416204999389da",
    measurementId: "G-72ELQT1DD7"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let unsubscribeSnapshot = null;
  let allNotes = [];
  let currentSelectedTag = '💡 靈感';
  let editModal;

  // === 🔒 端對端加密 (E2E AES-256-GCM) 多金鑰相容模組 ===
  let cryptoKey1k = null;
  let cryptoKey100k = null;

  async function initCryptoKey(uid) {
    if (!window.crypto || !window.crypto.subtle) {
      console.warn("當前瀏覽器環境不支援 Web Crypto Subtitle，將使用原始資料處理");
      return;
    }
    try {
      const encoder = new TextEncoder();
      const keyMaterial = await window.crypto.subtle.importKey(
        "raw",
        encoder.encode("HandyDreamSecretSalt_2026_" + uid),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );
      cryptoKey1k = await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: encoder.encode("Salt_" + uid),
          iterations: 1000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
      cryptoKey100k = await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: encoder.encode("Salt_" + uid),
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    } catch (e) {
      console.error("端對端加密初始化失敗:", e);
    }
  }

  async function encryptData(plainText) {
    const key = cryptoKey1k || cryptoKey100k;
    if (!plainText || !key) return plainText;
    if (typeof plainText === 'string' && plainText.startsWith('ENC:v1:')) return plainText;
    
    try {
      const encoder = new TextEncoder();
      const data = encoder.encode(plainText);
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const encryptedBuffer = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        data
      );
      
      const combined = new Uint8Array(iv.length + encryptedBuffer.byteLength);
      combined.set(iv, 0);
      combined.set(new Uint8Array(encryptedBuffer), iv.length);
      
      let binary = '';
      const len = combined.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(combined[i]);
      }
      return 'ENC:v1:' + btoa(binary);
    } catch (e) {
      console.error("加密過程失敗:", e);
      return plainText;
    }
  }

  async function attemptDecrypt(cipherText, key) {
    if (!key || typeof cipherText !== 'string') return null;
    let base64Str = '';
    if (cipherText.startsWith('ENC:v1:')) {
      base64Str = cipherText.slice(7);
    } else if (cipherText.startsWith('ENC:')) {
      base64Str = cipherText.slice(4);
    } else {
      return null;
    }
    
    try {
      const binary = atob(base64Str);
      const combined = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        combined[i] = binary.charCodeAt(i);
      }
      
      const iv = combined.slice(0, 12);
      const data = combined.slice(12);
      
      const decryptedBuffer = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        data
      );
      
      return new TextDecoder().decode(decryptedBuffer);
    } catch (e) {
      return null;
    }
  }

  async function decryptData(cipherText) {
    if (!cipherText) return cipherText;
    if (typeof cipherText !== 'string') return cipherText;
    
    // 舊版明文資料直接回傳
    if (!cipherText.startsWith('ENC:')) return cipherText;
    
    // 優先使用 1,000 次迭代金鑰解密
    let res = await attemptDecrypt(cipherText, cryptoKey1k);
    if (res !== null) return res;

    // 嘗試使用 100,000 次迭代金鑰解密
    res = await attemptDecrypt(cipherText, cryptoKey100k);
    if (res !== null) return res;

    // 若皆無法解密則回傳原字串以保護資料不被刪除
    return cipherText;
  }

  window.onerror = function(msg, url, lineNo, columnNo, error) {
    console.error("全域異常:", msg, error);
    alert("系統發現異常: " + msg + "\n(請確認 Firebase Console 權限與設定)");
    return false;
  };

  window.onload = function() {
    const modalEl = document.getElementById('editNoteModal');
    if (modalEl && typeof bootstrap !== 'undefined') {
      editModal = new bootstrap.Modal(modalEl);
    }

    // 快捷鍵支援：Ctrl + Enter 快速發表
    document.getElementById('note-input').addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        addNote();
      }
    });

    // 處理重定向登入結果
    auth.getRedirectResult().then(result => {
      if (result && result.user) {
        currentUser = result.user;
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('user-email-text').innerText = result.user.email || result.user.displayName || '已登入';
        subscribeToNotes(result.user.uid);
      }
    }).catch(err => {
      console.error("Redirect 登入錯誤:", err);
      if (err.code !== 'auth/popup-closed-by-user') {
        alert("登入重定向失敗 (" + err.code + "): " + err.message);
      }
      document.getElementById('loading').style.display = 'none';
    });

    auth.onAuthStateChanged(async user => {
      if (user) {
        currentUser = user;
        try {
          await initCryptoKey(user.uid);
        } catch(e) {
          console.error("加密金鑰準備異常:", e);
        }
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('user-email-text').innerText = user.email || user.displayName || '已登入';
        subscribeToNotes(user.uid);
      } else {
        currentUser = null;
        cryptoKey = null;
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        document.getElementById('login-overlay').style.display = 'flex';
        document.getElementById('loading').style.display = 'none';
      }
    });
  };

  // Google 登入 (優先使用 Popup 以突破行動端 Safari ITP 跨網域 Cookie 限制)
  function loginWithGoogle(forceRedirect = false) {
    const provider = new firebase.auth.GoogleAuthProvider();
    document.getElementById('loading').style.display = 'flex';
    document.getElementById('loading-text').innerText = "登入驗證中...";

    if (forceRedirect) {
      auth.signInWithRedirect(provider);
      return;
    }

    auth.signInWithPopup(provider).then(result => {
      if (result && result.user) {
        currentUser = result.user;
        document.getElementById('login-overlay').style.display = 'none';
      }
    }).catch(err => {
      console.warn("Google Popup 登入遭阻擋，嘗試切換 Redirect:", err);
      if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
        auth.signInWithRedirect(provider);
      } else {
        document.getElementById('loading').style.display = 'none';
      }
    });
  }

  let selectedNoteNumber = null;
  let editSelectedNoteNumber = null;

  function generateNumberCircles(containerId, activeNum, selectFuncName) {
    const container = document.getElementById(containerId);
    if (!container) return;
    let html = '';
    for (let i = 1; i <= 39; i++) {
      const isActive = (i === activeNum);
      html += `<div class="num-circle-btn ${isActive ? 'active' : ''}" onclick="${selectFuncName}(${i})">${i}</div>`;
    }
    container.innerHTML = html;
  }

  function selectTag(el, tag) {
    document.querySelectorAll('#tag-selector .tag-pill').forEach(pill => pill.classList.remove('active'));
    el.classList.add('active');
    currentSelectedTag = tag;

    const numSection = document.getElementById('number-picker-section');
    if (tag === '💡 靈感') {
      numSection.style.display = 'block';
    } else {
      numSection.style.display = 'none';
      document.getElementById('number-toggle-switch').checked = false;
      toggleNumberPicker(false);
    }
  }

  function toggleNumberPicker(enabled) {
    const grid = document.getElementById('number-circles-grid');
    const label = document.getElementById('number-toggle-label');
    if (enabled) {
      grid.style.display = 'flex';
      label.innerText = '開啟';
      if (!selectedNoteNumber) selectedNoteNumber = 1;
      generateNumberCircles('number-circles-grid', selectedNoteNumber, 'selectNumberCircle');
    } else {
      grid.style.display = 'none';
      label.innerText = '關閉';
      selectedNoteNumber = null;
    }
  }

  function selectNumberCircle(num) {
    selectedNoteNumber = num;
    generateNumberCircles('number-circles-grid', selectedNoteNumber, 'selectNumberCircle');
  }

  function onEditTagChange() {
    const tag = document.getElementById('edit-note-tag').value;
    const section = document.getElementById('edit-number-picker-section');
    if (tag === '💡 靈感') {
      section.style.display = 'block';
    } else {
      section.style.display = 'none';
      document.getElementById('edit-number-toggle-switch').checked = false;
      toggleEditNumberPicker(false);
    }
  }

  function toggleEditNumberPicker(enabled) {
    const grid = document.getElementById('edit-number-circles-grid');
    const label = document.getElementById('edit-number-toggle-label');
    if (enabled) {
      grid.style.display = 'flex';
      label.innerText = '開啟';
      if (!editSelectedNoteNumber) editSelectedNoteNumber = 1;
      generateNumberCircles('edit-number-circles-grid', editSelectedNoteNumber, 'selectEditNumberCircle');
    } else {
      grid.style.display = 'none';
      label.innerText = '關閉';
      editSelectedNoteNumber = null;
    }
  }

  function selectEditNumberCircle(num) {
    editSelectedNoteNumber = num;
    generateNumberCircles('edit-number-circles-grid', editSelectedNoteNumber, 'selectEditNumberCircle');
  }

  function getUserDocRef(uid) {
    return db.collection('users').doc(uid);
  }

  function subscribeToNotes(uid) {
    const docRef = getUserDocRef(uid);

    if (unsubscribeSnapshot) unsubscribeSnapshot();

    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('loading').style.display = 'flex';
    document.getElementById('loading-text').innerText = "資料解密同步中...";

    unsubscribeSnapshot = docRef.onSnapshot(async doc => {
      try {
        if (doc.exists) {
          const rawNotes = doc.data().notes || [];
          allNotes = await Promise.all(rawNotes.map(async note => ({
            ...note,
            content: await decryptData(note.content)
          })));
        } else {
          allNotes = [];
          await saveNotesToFirestore(allNotes);
        }
        renderNotes();
      } catch (err) {
        console.error("靈感同步失敗:", err);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }, err => {
      console.error("Firestore 讀取錯誤:", err);
      alert("Firestore 資料讀取失敗 (" + err.code + "):\n" + err.message + "\n\n常見原因：\n1. Firebase Console 尚未建立 Firestore 數據庫\n2. Firestore Rules 規則限制存取 (需設定 allow read, write)");
      renderNotes();
      document.getElementById('loading').style.display = 'none';
    });
  }

  async function saveNotesToFirestore(notes) {
    if (!currentUser) return;
    try {
      const encryptedNotes = await Promise.all(notes.map(async note => ({
        ...note,
        content: await encryptData(note.content)
      })));
      await getUserDocRef(currentUser.uid).set({ notes: encryptedNotes }, { merge: true });
    } catch (err) {
      console.error("儲存靈感失敗:", err);
      alert("儲存失敗: " + err.message);
    }
  }

  // 新增靈感
  async function addNote() {
    const input = document.getElementById('note-input');
    const content = input.value.trim();
    if (!content) {
      alert("請輸入靈感內容！");
      return;
    }

    const now = new Date();
    const newNote = {
      id: 'note_' + Date.now(),
      content: content,
      tag: currentSelectedTag,
      number: (currentSelectedTag === '💡 靈感' && selectedNoteNumber) ? selectedNoteNumber : null,
      createdAt: now.getTime(),
      isPinned: false
    };

    allNotes.unshift(newNote); // 放在最新一筆
    input.value = '';

    // 重置數字標號選擇器
    document.getElementById('number-toggle-switch').checked = false;
    toggleNumberPicker(false);

    renderNotes();
    await saveNotesToFirestore(allNotes);
  }

  // 渲染靈感時間軸列表
  function renderNotes() {
    const container = document.getElementById('notes-container');
    const query = document.getElementById('search-input') ? document.getElementById('search-input').value.trim().toLowerCase() : '';
    const searchDate = document.getElementById('search-date-input') ? document.getElementById('search-date-input').value : '';
    container.innerHTML = '';

    let filtered = allNotes.filter(n => {
      const d = new Date(n.createdAt);
      const dateIso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const dateSlash = d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
      const dateZh = (d.getMonth() + 1) + "月" + d.getDate() + "日";
      const fullZh = d.getFullYear() + "年" + dateZh;

      // 日期選擇器精確比對
      if (searchDate && dateIso !== searchDate) {
        return false;
      }

      // 文字、數字與日期模糊搜尋
      if (query) {
        const matchesContent = n.content.toLowerCase().includes(query);
        const matchesTag = n.tag && n.tag.toLowerCase().includes(query);
        const matchesNumber = n.number && (String(n.number) === query || ('#' + n.number) === query);
        const matchesDate = dateIso.includes(query) || dateSlash.includes(query) || dateZh.includes(query) || fullZh.includes(query);
        return matchesContent || matchesTag || matchesNumber || matchesDate;
      }

      return true;
    });

    if (!filtered.length) {
      container.innerHTML = `
        <div class="text-center py-5 text-muted">
          <i class="fa-regular fa-lightbulb fa-3x mb-3 opacity-25"></i>
          <p class="fw-bold">尚未記錄靈感或查無結果</p>
          <small>有什麼新點子，立即在上方寫下吧！</small>
        </div>
      `;
      return;
    }

    // 分離置頂項目與一般時間軸項目
    const pinnedNotes = filtered.filter(n => n.isPinned);
    const normalNotes = filtered.filter(n => !n.isPinned);

    // 渲染置頂區塊
    if (pinnedNotes.length) {
      container.innerHTML += `<div class="date-header text-warning"><i class="fa-solid fa-thumbtack me-2"></i>置頂靈感</div>`;
      pinnedNotes.forEach(n => container.innerHTML += createNoteCardHtml(n));
    }

    // 按日期分組 (YYYY-MM-DD)
    const groups = {};
    normalNotes.forEach(note => {
      const dateObj = new Date(note.createdAt);
      const dateKey = formatDateKey(dateObj);
      if (!groups[dateKey]) groups[dateKey] = [];
      groups[dateKey].push(note);
    });

    Object.keys(groups).forEach(dateKey => {
      container.innerHTML += `<div class="date-header"><i class="fa-regular fa-calendar-days me-2"></i>${dateKey}</div>`;
      groups[dateKey].forEach(n => container.innerHTML += createNoteCardHtml(n));
    });
  }

  function formatDateKey(date) {
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);

    if (date.toDateString() === today.toDateString()) {
      return "今天 (" + (date.getMonth() + 1) + "月" + date.getDate() + "日)";
    } else if (date.toDateString() === yesterday.toDateString()) {
      return "昨天 (" + (date.getMonth() + 1) + "月" + date.getDate() + "日)";
    } else {
      return date.getFullYear() + "年" + (date.getMonth() + 1) + "月" + date.getDate() + "日";
    }
  }

  function formatTimeStr(timestamp) {
    const d = new Date(timestamp);
    const hrs = String(d.getHours()).padStart(2, '0');
    const mins = String(d.getMinutes()).padStart(2, '0');
    const secs = String(d.getSeconds()).padStart(2, '0');
    return hrs + ":" + mins + ":" + secs;
  }

  function createNoteCardHtml(note) {
    let tagBadgeHtml = `<span class="badge bg-light text-dark border me-2">${escapeHtml(note.tag || '💡 靈感')}</span>`;
    if (note.tag === '💡 靈感' || !note.tag) {
      if (note.number) {
        tagBadgeHtml = `<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle fw-bold me-2" style="font-size:0.85rem;">💡 靈感<span class="num-circle-badge">${note.number}</span></span>`;
      } else {
        tagBadgeHtml = `<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle fw-bold me-2" style="font-size:0.85rem;">💡 靈感</span>`;
      }
    }

    return `
      <div class="note-card ${note.isPinned ? 'pinned' : ''}">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <div>${tagBadgeHtml}</div>
          <span class="note-time-badge"><i class="fa-regular fa-clock me-1"></i>${formatTimeStr(note.createdAt)}</span>
        </div>
        <div class="note-content-text">${escapeHtml(note.content)}</div>
        <div class="d-flex justify-content-end gap-2 pt-2 border-top">
          <button class="btn-action-sm" onclick="togglePin('${note.id}')" title="${note.isPinned?'取消置頂':'置頂筆記'}">
            <i class="fa-solid fa-thumbtack ${note.isPinned ? 'text-warning' : ''}"></i>
          </button>
          <button class="btn-action-sm" onclick="copyNoteText('${note.id}')" title="複製文字">
            <i class="fa-regular fa-copy"></i>
          </button>
          <button class="btn-action-sm" onclick="openEditModal('${note.id}')" title="編輯修改">
            <i class="fa-solid fa-pen me-1"></i>編輯
          </button>
        </div>
      </div>
    `;
  }

  function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // 切換置頂
  async function togglePin(id) {
    const note = allNotes.find(n => n.id === id);
    if (note) {
      note.isPinned = !note.isPinned;
      renderNotes();
      await saveNotesToFirestore(allNotes);
    }
  }

  // 複製筆記文字
  function copyNoteText(id) {
    const note = allNotes.find(n => n.id === id);
    if (note) {
      navigator.clipboard.writeText(note.content).then(() => {
        alert("已成功複製靈感內容到剪貼簿！");
      });
    }
  }

  // 開啟編輯 Modal
  function openEditModal(id) {
    const note = allNotes.find(n => n.id === id);
    if (!note) return;

    document.getElementById('edit-note-id').value = note.id;
    document.getElementById('edit-note-content').value = note.content;
    document.getElementById('edit-note-tag').value = note.tag || '💡 靈感';

    // 格式化日期時間為 datetime-local 格式 (YYYY-MM-DDTHH:mm)
    const d = new Date(note.createdAt);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    document.getElementById('edit-note-datetime').value = d.toISOString().slice(0, 16);

    // 處理數字標點狀態
    const editTagSelect = document.getElementById('edit-note-tag');
    editTagSelect.onchange = onEditTagChange;

    if (note.tag === '💡 靈感' || !note.tag) {
      document.getElementById('edit-number-picker-section').style.display = 'block';
      if (note.number) {
        document.getElementById('edit-number-toggle-switch').checked = true;
        editSelectedNoteNumber = note.number;
        toggleEditNumberPicker(true);
      } else {
        document.getElementById('edit-number-toggle-switch').checked = false;
        toggleEditNumberPicker(false);
      }
    } else {
      document.getElementById('edit-number-picker-section').style.display = 'none';
      document.getElementById('edit-number-toggle-switch').checked = false;
      toggleEditNumberPicker(false);
    }

    editModal.show();
  }

  // 儲存編輯修改
  async function saveNoteEdit() {
    const id = document.getElementById('edit-note-id').value;
    const content = document.getElementById('edit-note-content').value.trim();
    const tag = document.getElementById('edit-note-tag').value;
    const datetimeVal = document.getElementById('edit-note-datetime').value;

    if (!content) {
      alert("內容不能為空！");
      return;
    }

    const note = allNotes.find(n => n.id === id);
    if (note) {
      note.content = content;
      note.tag = tag;
      note.number = (tag === '💡 靈感' && editSelectedNoteNumber) ? editSelectedNoteNumber : null;
      if (datetimeVal) {
        note.createdAt = new Date(datetimeVal).getTime();
      }
      
      // 依時間倒序重新排序
      allNotes.sort((a, b) => b.createdAt - a.createdAt);

      editModal.hide();
      renderNotes();
      await saveNotesToFirestore(allNotes);
    }
  }

  // 從 Modal 刪除靈感
  async function deleteNoteFromModal() {
    const id = document.getElementById('edit-note-id').value;
    if (confirm("確定要刪除此筆靈感紀錄嗎？此動作無法復原！")) {
      editModal.hide();
      allNotes = allNotes.filter(n => n.id !== id);
      renderNotes();
      await saveNotesToFirestore(allNotes);
    }
  }

  function clearSearch() {
    if (document.getElementById('search-input')) document.getElementById('search-input').value = '';
    if (document.getElementById('search-date-input')) document.getElementById('search-date-input').value = '';
    renderNotes();
  }
</script>
</body>
</html>
